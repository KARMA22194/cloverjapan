# Produktions-Stack für Self-Hosting (CasaOS o. Ä.).
#
# Für die Erreichbarkeit aus dem Internet gibt es ZWEI Wege. Beide verbinden
# sich **ausgehend** (kein Port-Forwarding, funktioniert hinter CGNAT) und
# bringen HTTPS mit — das ist Pflicht, sonst sind Passkeys, PWA, Web-Push und
# die Standortabfrage tot. Gewählt wird über ein Compose-Profil:
#
#   # Tailscale Funnel — kostenlos, feste Adresse nuc.tailXXXX.ts.net
#   docker compose -f docker-compose.prod.yml --env-file .env.prod \
#     --profile tailscale up -d --build
#
#   # Cloudflare Tunnel — braucht eine eigene Domain in deinem Cloudflare-Konto
#   docker compose -f docker-compose.prod.yml --env-file .env.prod \
#     --profile cloudflare up -d --build
#
# ⚠️ Ein Profil MUSS angegeben werden. Ohne eines startet der Stack zwar, ist
# aber nur im lokalen Netz erreichbar — nach außen führt dann nichts.
#
# ⚠️ Zwei Profile statt zweier Compose-Dateien: eine zweite Datei müsste db,
# migrate, app und cron duplizieren, und beide liefen über kurz oder lang
# auseinander. Genau diese Art Doppelpflege hatte hier schon dafür gesorgt,
# dass die Produktionsvariante zwei Postgres-Hauptversionen zurückhing.

services:
  db:
    # ⚠️ Muss zur Version in `docker-compose.yml` (Entwicklung) passen — dort 18.
    # Zwei Hauptversionen Unterschied fallen erst beim Deploy auf; hier stand
    # 16, während Entwicklung und Neon längst auf 18 liefen.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-clover}
    volumes:
      # ⚠️ Ab Postgres 18 liegt PGDATA in einem versionsbenannten Unterordner
      # (`…/18/docker`) statt unter `…/data`. Der Mount greift deshalb eine
      # Ebene höher. Mit dem alten Pfad startet der Container in einer
      # Neustartschleife und meldet nur „is restarting" — die Erklärung steht
      # ausschließlich in `docker compose logs db`.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clover} -d ${POSTGRES_DB:-clover}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-Shot: wendet ausstehende Migrationen an und beendet sich. Die App
  # startet erst, wenn dies erfolgreich durchgelaufen ist.
  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.prod
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Löst die beiden Cron-Endpunkte aus (Flugstatus + nächtliches Aufräumen).
  #
  # ⚠️ Auf Vercel übernimmt das `vercel.json`, aber nur für `cleanup`: der
  # Hobby-Tarif erlaubt genau **einen** Cron-Lauf pro Tag. Deshalb wird der
  # Flugstatus dort von außen angestoßen (cron-job.org). Hier entfällt dieser
  # Umweg — der Takt ist frei wählbar.
  #
  # ⚠️ Bekommt NUR `CRON_SECRET`, nicht die ganze `.env.prod`: der Container
  # braucht nichts weiter, und was er nicht kennt, kann er nicht verlieren.
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET fehlt — ohne Secret sind die Cron-Endpunkte gesperrt}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-900}
      CRON_CLEANUP_HOUR: ${CRON_CLEANUP_HOUR:-4}
    volumes:
      - ./docker/cron.sh:/cron.sh:ro
    entrypoint: ["sh", "/cron.sh"]
    depends_on:
      app:
        condition: service_started

  # Tailscale Funnel — veröffentlicht die App unter https://<host>.<tailnet>.ts.net.
  # Kostenlos im Personal-Plan, kein Port-Forwarding, Zertifikat von Tailscale.
  #
  # ⚠️ **Das State-Volume ist nicht Komfort, sondern Korrektheit.** Geht der
  # Zustand verloren, meldet sich der Container als NEUER Knoten an und bekommt
  # einen angehängten Zähler (`clover-1`). Damit ändert sich die öffentliche
  # Adresse — und weil sie in `WEBAUTHN_RP_ID` steckt, sind in dem Moment alle
  # Passkeys ungültig und sämtliche Push-Abos tot.
  #
  # ⚠️ Zwei Dinge müssen im Tailscale-Admin eingeschaltet sein, sonst startet
  # zwar alles, nur erreichbar ist nichts: **HTTPS Certificates** (DNS-Seite)
  # und das **Funnel-Attribut** in der Policy. Siehe SELFHOST.md.
  #
  # ⚠️ `TS_USERSPACE=true` vermeidet `/dev/net/tun` und `NET_ADMIN`. Als reiner
  # Reverse-Proxy braucht dieser Container keinen Kernel-Zugriff — und ein
  # Container ohne erweiterte Rechte ist einer weniger, der welche hat.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-clover}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-clover}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - app

  # Cloudflare Tunnel — verbindet den Public-Hostname mit http://app:3000.
  # TUNNEL_TOKEN aus dem Cloudflare Zero-Trust-Dashboard (Tunnel anlegen).
  cloudflared:
    # ⚠️ `${TUNNEL_TOKEN:-}` statt `:?`: Compose wertet ALLE Variablen beim
    # Parsen aus, auch die von Diensten, deren Profil gar nicht aktiv ist. Mit
    # `:?` ließe sich der Tailscale-Weg ohne Cloudflare-Token nicht starten.
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  db-data:
  tailscale-state:
