# Produktions-Stack für Self-Hosting (CasaOS o. Ä.).
# Start:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Erreichbarkeit über Cloudflare Tunnel: cloudflared verbindet sich ausgehend
# mit Cloudflare (kein Port-Forwarding, TLS automatisch). Im Cloudflare-
# Dashboard zeigt der Public-Hostname auf den internen Service http://app:3000.

services:
  db:
    # ⚠️ Muss zur Version in `docker-compose.yml` (Entwicklung) passen — dort 18.
    # Zwei Hauptversionen Unterschied fallen erst beim Deploy auf; hier stand
    # 16, während Entwicklung und Neon längst auf 18 liefen.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-clover}
    volumes:
      # ⚠️ Ab Postgres 18 liegt PGDATA in einem versionsbenannten Unterordner
      # (`…/18/docker`) statt unter `…/data`. Der Mount greift deshalb eine
      # Ebene höher. Mit dem alten Pfad startet der Container in einer
      # Neustartschleife und meldet nur „is restarting" — die Erklärung steht
      # ausschließlich in `docker compose logs db`.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clover} -d ${POSTGRES_DB:-clover}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-Shot: wendet ausstehende Migrationen an und beendet sich. Die App
  # startet erst, wenn dies erfolgreich durchgelaufen ist.
  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.prod
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Löst die beiden Cron-Endpunkte aus (Flugstatus + nächtliches Aufräumen).
  #
  # ⚠️ Auf Vercel übernimmt das `vercel.json`, aber nur für `cleanup`: der
  # Hobby-Tarif erlaubt genau **einen** Cron-Lauf pro Tag. Deshalb wird der
  # Flugstatus dort von außen angestoßen (cron-job.org). Hier entfällt dieser
  # Umweg — der Takt ist frei wählbar.
  #
  # ⚠️ Bekommt NUR `CRON_SECRET`, nicht die ganze `.env.prod`: der Container
  # braucht nichts weiter, und was er nicht kennt, kann er nicht verlieren.
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET fehlt — ohne Secret sind die Cron-Endpunkte gesperrt}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-900}
      CRON_CLEANUP_HOUR: ${CRON_CLEANUP_HOUR:-4}
    volumes:
      - ./docker/cron.sh:/cron.sh:ro
    entrypoint: ["sh", "/cron.sh"]
    depends_on:
      app:
        condition: service_started

  # Cloudflare Tunnel — verbindet den Public-Hostname mit http://app:3000.
  # TUNNEL_TOKEN aus dem Cloudflare Zero-Trust-Dashboard (Tunnel anlegen).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN fehlt}
    depends_on:
      - app

volumes:
  db-data:
